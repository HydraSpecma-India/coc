<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 900" width="100%" height="100%" style="background:#111318; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <!-- Subtle Box Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Grid lines -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03" />
  </pattern>
  <rect width="1380" height="900" fill="url(#grid)" />

  <!-- ================================================================= -->
  <!-- 1. CLIENT TIER (BROWSER) -->
  <!-- ================================================================= -->
  <g id="tier-client">
    <rect x="420" y="35" width="480" height="135" rx="6" fill="#151921" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    <text x="435" y="56" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="0.3">Client Tier (Browser)</text>

    <!-- Next.js 14 Web UI -->
    <g id="node-web-ui">
      <rect x="438" y="70" width="215" height="78" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="545" y="102" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Next.js 14 Web UI</text>
      <text x="545" y="122" fill="#94a3b8" font-size="10.5" font-weight="500" text-anchor="middle">(Responsive Desktop / Tablet)</text>
    </g>

    <!-- Canvas Template Designer -->
    <g id="node-designer">
      <rect x="668" y="70" width="215" height="78" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="775" y="102" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Canvas Template Designer</text>
      <text x="775" y="122" fill="#94a3b8" font-size="10.5" font-weight="500" text-anchor="middle">(Interactive WYSIWYG)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 2. APPLICATION TIER (AZURE APP SERVICE / NODE.JS) -->
  <!-- ================================================================= -->
  <g id="tier-app">
    <rect x="420" y="275" width="875" height="290" rx="6" fill="#151921" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    <text x="435" y="296" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="0.3">Application Tier (Azure App Service / Node.js)</text>

    <!-- Next.js App Router Server -->
    <g id="node-app-router">
      <rect x="438" y="315" width="205" height="52" rx="5" fill="#1e2430" stroke="#38bdf8" stroke-width="1.4" />
      <text x="540" y="346" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Next.js App Router Server</text>
    </g>

    <!-- Role & Capability Guard -->
    <g id="node-rbac">
      <rect x="525" y="395" width="195" height="58" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="622" y="420" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Role &amp; Capability Guard</text>
      <text x="622" y="438" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">(RBAC Enforcement)</text>
    </g>

    <!-- Auth.js (NextAuth v5) -->
    <g id="node-auth">
      <rect x="525" y="480" width="205" height="60" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="627" y="506" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Auth.js (NextAuth v5)</text>
      <text x="627" y="524" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Entra ID OIDC + Credentials</text>
    </g>

    <!-- In-Memory LRU & TTL Caches -->
    <g id="node-cache">
      <rect x="740" y="395" width="265" height="58" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="872" y="420" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">In-Memory LRU &amp; TTL Caches</text>
      <text x="872" y="438" fill="#94a3b8" font-size="9.5" font-weight="500" text-anchor="middle">(Tokens, DB Settings, Fields, Skeletons)</text>
    </g>

    <!-- PDF Assembly Engine -->
    <g id="node-pdf">
      <rect x="1025" y="395" width="185" height="58" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="1117" y="420" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">PDF Assembly Engine</text>
      <text x="1117" y="438" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">(pdf-lib / Canvas)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 3. DATA & STORAGE TIER (SUPABASE) -->
  <!-- ================================================================= -->
  <g id="tier-data">
    <rect x="25" y="690" width="460" height="155" rx="6" fill="#151921" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    <text x="40" y="711" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="0.3">Data &amp; Storage Tier (Supabase)</text>

    <!-- Supabase PostgreSQL -->
    <g id="node-supabase-db">
      <!-- Database cylinder outline -->
      <rect x="42" y="730" width="205" height="88" rx="6" fill="#1e2430" stroke="#10b981" stroke-width="1.3" />
      <ellipse cx="144" cy="742" rx="70" ry="8" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.6" />
      <text x="144" y="768" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Supabase PostgreSQL</text>
      <text x="144" y="788" fill="#94a3b8" font-size="9.5" font-weight="500" text-anchor="middle">(11 Core Tables, RLS, Foreign Keys)</text>
    </g>

    <!-- Supabase Storage -->
    <g id="node-supabase-storage">
      <rect x="260" y="730" width="205" height="88" rx="6" fill="#1e2430" stroke="#10b981" stroke-width="1.3" />
      <ellipse cx="362" cy="742" rx="70" ry="8" fill="#064e3b" stroke="#10b981" stroke-width="1" opacity="0.6" />
      <text x="362" y="768" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Supabase Storage</text>
      <text x="362" y="788" fill="#94a3b8" font-size="9.5" font-weight="500" text-anchor="middle">(Background PDFs, Asset Badges)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- 4. MICROSOFT CLOUD ECOSYSTEM -->
  <!-- ================================================================= -->
  <g id="tier-external">
    <rect x="500" y="690" width="850" height="155" rx="6" fill="#151921" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
    <text x="515" y="711" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="0.3">Microsoft Cloud Ecosystem</text>

    <!-- Dynamics 365 F&O -->
    <g id="node-d365">
      <rect x="515" y="730" width="185" height="88" rx="5" fill="#1e2430" stroke="#38bdf8" stroke-width="1.3" />
      <text x="607" y="766" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Dynamics 365 F&amp;O</text>
      <text x="607" y="786" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">(OData REST APIs)</text>
    </g>

    <!-- SharePoint Online -->
    <g id="node-sharepoint">
      <rect x="715" y="730" width="195" height="88" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="812" y="766" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">SharePoint Online</text>
      <text x="812" y="786" fill="#94a3b8" font-size="9.5" font-weight="500" text-anchor="middle">(Microsoft Graph REST API)</text>
    </g>

    <!-- Microsoft Teams -->
    <g id="node-teams">
      <rect x="925" y="730" width="185" height="88" rx="5" fill="#1e2430" stroke="#475569" stroke-width="1.2" />
      <text x="1017" y="766" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Microsoft Teams</text>
      <text x="1017" y="786" fill="#94a3b8" font-size="9.5" font-weight="500" text-anchor="middle">(Power Automate Webhook)</text>
    </g>

    <!-- Microsoft Entra ID -->
    <g id="node-entra">
      <rect x="1125" y="730" width="205" height="88" rx="5" fill="#1e2430" stroke="#a855f7" stroke-width="1.3" />
      <text x="1227" y="766" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Microsoft Entra ID</text>
      <text x="1227" y="786" fill="#94a3b8" font-size="9.5" font-weight="500" text-anchor="middle">(SSO, Token Exchange)</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- CONNECTIONS & LABELS -->
  <!-- ================================================================= -->

  <!-- Client to App Router Connections -->
  <!-- Line 1: Next.js UI -> NextServer -->
  <path d="M 500 148 L 500 205 L 470 205 L 470 315" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="382" y="193" width="175" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="469" y="209" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">HTTPS / Next.js Server Actions</text>
  </g>

  <!-- Line 2: Designer -> NextServer -->
  <path d="M 775 148 L 775 225 L 590 225 L 590 315" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="668" y="200" width="160" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="748" y="216" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">Template JSON / Asset Upload</text>
  </g>

  <!-- Internal App Tier Connections -->
  <!-- NextServer -> Guard -->
  <path d="M 540 367 L 540 395" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Guard -> AuthModule -->
  <path d="M 622 453 L 622 480" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- NextServer -> CacheLayer -->
  <path d="M 643 340 L 780 340 L 780 395" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- NextServer -> PDFEngine -->
  <path d="M 643 325 L 1100 325 L 1100 395" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Outbound Connections to Bottom Tier -->
  <!-- Connection: SQL Client -> Supabase PostgreSQL -->
  <path d="M 450 367 L 450 600 L 144 600 L 144 730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="68" y="588" width="150" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="143" y="604" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">SQL Client (Parameterized)</text>
  </g>

  <!-- Connection: S3 REST -> Supabase Storage -->
  <path d="M 465 367 L 465 625 L 362 625 L 362 730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="288" y="613" width="145" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="360" y="629" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">S3 REST / Signed URLs</text>
  </g>

  <!-- Connection: OData v4 -> Dynamics 365 -->
  <path d="M 480 367 L 480 650 L 607 650 L 607 730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="528" y="638" width="155" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="605" y="654" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">OData v4 / Bearer Token</text>
  </g>

  <!-- Connection: Graph API -> SharePoint Online -->
  <path d="M 495 367 L 495 590 L 812 590 L 812 730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="725" y="578" width="170" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="810" y="594" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">Graph API v1.0 / Bearer Token</text>
  </g>

  <!-- Connection: Adaptive Card -> Teams -->
  <path d="M 510 367 L 510 615 L 1017 615 L 1017 730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="940" y="603" width="150" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="1015" y="619" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">Adaptive Card Payload</text>
  </g>

  <!-- Connection: OAuth 2.0 -> Microsoft Entra ID -->
  <path d="M 627 540 L 627 565 L 1227 565 L 1227 730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  <g>
    <rect x="1140" y="553" width="175" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="1227" y="569" fill="#e2e8f0" font-size="9.5" font-weight="600" text-anchor="middle">OAuth 2.0 / OpenID Connect</text>
  </g>
</svg>